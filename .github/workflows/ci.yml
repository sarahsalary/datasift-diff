name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Install optional test dependencies (best-effort)
        continue-on-error: true
        run: |
          pip install pyyaml lxml openpyxl datasift-py || true
          pip install fastapi uvicorn python-multipart httpx || true

      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: ruff check src tests

      - name: Type check (mypy, non-blocking)
        continue-on-error: true
        run: mypy src

      - name: Run tests
        run: pytest -q